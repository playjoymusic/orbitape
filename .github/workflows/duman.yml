# ORBITAPE — YAYIN DUMAN TESTI
#
# NEDEN VAR
#   2 Eylül. kontrol.sh 810/810 yeşil verdi, Cloudflare "deployed"
#   dedi, panelde hata oranı %0 göründü — ve orbitape.app/np 24
#   dakika boyunca 404 döndü. Bulan şey bir test değil, bir insanın
#   linke bakmasıydı. Aynı koşuda ikinci bir açık daha çıktı:
#   uygulamayı herkesin açtığı "/" adresinde CSP başlığı hiç yoktu.
#
#   İkisinin de ortak sebebi tek: bütün testlerimiz DOSYAYA bakıyordu,
#   hiçbiri YAYINA bakmıyordu. Aradaki boşluğa yayın tarifi, varlık
#   yönlendiricisi, _headers eşleşmesi ve alan adı giriyor.
#
# NE YAPAR
#   araclar/duman.sh — canlı adrese sırayla sorar. Tek kontrol düşse
#   iş kırmızı yanar ve GitHub e-posta gönderir.
#
# İKİ AYRI SORU, İKİ AYRI TETİK
#   push      → "yayın gerçekten çıktı mı": önce yayının yetişmesi
#               beklenir (KATI=1), sonra sorular sorulur. Beklemeden
#               sorsaydık bütün cevaplar ESKİ sürümden gelir ve yeşil
#               yanardı — yani yeni sürümü hiç sınamamış olurduk.
#   schedule  → "site şu anda ayakta mı": 15 dakikada bir. Burada
#               KATI kapalı; elle geri alma yapıldıysa iş boşuna
#               kırmızı yanmasın, soru "sağlam mı", "güncel mi" değil.
#
# MALİYET
#   Koşu ~25 saniye, tarayıcı yok, kurulum yok. Herkese açık depoda
#   ücretsiz.
#
# NE YAZMIYOR
#   /olcu'ya kayıt DÜŞÜRMÜYOR. Worker'a ulaştığını GET (405) ve yanlış
#   içerik türü (415) ile kanıtlıyor. 15 dakikada bir sahte ölçüm
#   bırakmak ölçümün kendisini değersiz kılardı.

name: Yayın duman testi

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# issues: write — kirmizi yanınca ISSUE aciliyor (asagiya bak).
permissions:
  contents: read
  issues: write

# Aynı anda iki koşu olmasın: push ile zamanlanmış koşu çakışırsa
# ikisi de aynı şeyi sorar, biri yeter.
concurrency:
  group: duman
  cancel-in-progress: false

jobs:
  duman:
    name: Yayin ayakta mi
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Depo lazım: betiğin kendisi, karşılaştırılacak index.html ve
      # assetlinks.json buradan geliyor.
      - name: Depoyu al
        uses: actions/checkout@v5

      - name: Yayini sina
        id: duman
        env:
          ADRES: https://orbitape.app
          # push: yayının yetişmesini 7 dakikaya kadar bekle.
          # schedule: bekleme yok, sadece sağlık sorusu.
          KATI: ${{ github.event_name == 'push' && '1' || '0' }}
          BEKLE: '420'
        run: |
          set -o pipefail
          bash araclar/duman.sh 2>&1 | tee /tmp/duman_cikti.txt

      # ── ALARM ────────────────────────────────────────────────────
      # 2 Eylül denetimi: nöbetçi 15 dakikada bir koşuyordu ama
      # KIMSEYE ULASMIYORDU. Tek dayanak GitHub'ın varsayılan
      # bildirim e-postasıydı; o da tek bir gelen kutusuna düşüyor ve
      # gece 02:00'de kimse bakmıyor.
      #
      # Issue farklı: telefondaki GitHub uygulamasına anlık bildirim
      # gider, konu başlığı okunur, ve KAPANANA KADAR açık durur —
      # yani "gördüm ama unuttum" hâli mümkün değil.
      #
      # TEK ISSUE: her koşuda yeni bir tane açmıyoruz. Aynı başlıkta
      # açık bir tane varsa oraya yorum düşüyor. Yoksa on beş dakikada
      # bir issue ile boğulurdu ve alarmın kendisi gürültüye dönerdi.
      - name: Kirmizi yandiysa haber ver
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let cikti = '';
            try{ cikti = fs.readFileSync('/tmp/duman_cikti.txt','utf8').slice(-4000); }catch(e){}
            const baslik = 'YAYIN BOZUK — duman testi kirmizi';
            const govde = [
              '**orbitape.app canli duman testi dustu.**',
              '',
              '- tetik: `' + context.eventName + '`',
              '- kosu: ' + context.serverUrl + '/' + context.repo.owner + '/'
                        + context.repo.repo + '/actions/runs/' + context.runId,
              '- commit: `' + context.sha.slice(0,7) + '`',
              '- saat (UTC): ' + new Date().toISOString(),
              '',
              '<details><summary>duman.sh ciktisi</summary>',
              '',
              '```',
              cikti.replace(/\u001b\[[0-9;]*m/g, ''),
              '```',
              '</details>',
              '',
              'Bu issue yayin duzelince KENDILIGINDEN kapanir.'
            ].join('\n');
            const acik = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'yayin-alarm', per_page: 5 });
            if(acik.data.length){
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: acik.data[0].number, body: govde });
            }else{
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: baslik, body: govde, labels: ['yayin-alarm'] });
            }

      # Yesil yandiysa acik alarmi kapat. Alarmin kendi kendine
      # kapanmasi sart: kapanmayan bir alarm bir sure sonra
      # "duruyor iste" diye gorulmeye baslar.
      - name: Yesil yandiysa alarmi kapat
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const acik = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'yayin-alarm', per_page: 20 });
            for(const it of acik.data){
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: it.number,
                body: 'Duman testi yesil yandi (' + new Date().toISOString()
                    + '). Alarm kapaniyor.' });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: it.number, state: 'closed' });
            }
