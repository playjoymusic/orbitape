# ORBITAPE — radyo bağlantı kontrolü
#
# NE YAPAR
#   Yayındaki radyo.json'u alır, 552 yayın adresini tek tek dener ve
#   bir RAPOR üretir: hangileri ölmüş, hangileri açılıyor ama CORS
#   başlığı olmadığı için uygulamada susuyor, hangi rafta kaç sağlam
#   istasyon kalmış.
#
# NEDEN BURADA KOŞUYOR
#   Geliştirme ortamından istasyon sunucularına çıkış kapalı (ölçüldü:
#   59 istasyonun 50'sine ulaşılamadı). Ağı olan tek yer burası.
#
# HİÇBİR YERE YAZMIYOR — BİLEREK
#   Bundan önceki hasat işi kod deposundan VERİ deposuna yazmaya
#   çalıştı ve "git exit 128" ile düştü: çapraz depo yazmak ayrı bir
#   token istiyor. Bu iş yalnızca rapor üretiyor; raporu aşağıdaki
#   özet ekranında okuyorsun, neyin eleneceğine sen karar veriyorsun.
#   Yani token yok, izin sorunu yok, ilk koşuda çalışır.
#
# SÜRE
#   Her adres tek tek denendiği için 5-10 dakika (12 istek aynı anda).

name: Radyo baglanti kontrolu

on:
  workflow_dispatch:            # elle: Actions -> Radyo baglanti kontrolu -> Run
  schedule:
    - cron: '23 5 3 * *'        # ayda bir, her ayın 3'ü

permissions:
  contents: read

jobs:
  kontrol:
    name: Baglantilari sina
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Depoyu al
        uses: actions/checkout@v5

      # Liste VERİ deposunda. Sadece OKUYORUZ: token gerekmiyor,
      # çünkü ham dosyayı herkese açık adresinden çekiyoruz.
      # ── LISTE ARTIK DEPONUN ICINDE ────────────────────────────
      # Eskiden veri deposunun ham adresinden cekiliyordu. O depo
      # ozele alininca adres 404 dondu; yani bu is de sessizce
      # yanlis calisiyordu. Tek kaynak kod deposu oldugu icin dosya
      # zaten checkout ile geliyor -- indirmeye gerek yok ve ag
      # kesintisi bu isi artik durduramiyor.
      - name: Listeyi say
        run: python3 -c "import json;print(len(json.load(open('radyo.json'))),'istasyon')"

      - name: Adresleri sina
        run: python3 araclar/radyo_kontrol.py radyo.json rapor.md rapor.json

      # Raporu Actions ekranının kendisine bas: tıklamadan okunuyor.
      - name: Ozete yaz
        if: always()
        run: cat rapor.md >> "$GITHUB_STEP_SUMMARY"

      - name: Raporu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radyo-baglanti-raporu
          path: |
            rapor.md
            rapor.json
          retention-days: 30
