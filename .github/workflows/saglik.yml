# ORBITAPE — her değişiklikte bütün sağlık kontrolleri
#
# NE YAPAR
#   Her push ve her pull request'te GitHub'ın kendi makinesinde bir tarayıcı
#   açılır, uygulama gerçekten çalıştırılır ve saglik.js'teki bütün kontroller
#   koşar: yerleşim, ses zinciri, çevrimdışı davranış, lisans, radyo süzgeci,
#   PWA dosyaları. Sonuç commit'in yanında yeşil tik ya da kırmızı çarpı olur.
#
# NEDEN
#   Testleri elle çalıştırmayı unutmak mümkün. Burada unutmak mümkün değil.
#
# SÜRE / MALİYET
#   Yaklaşık 3-4 dakika. Herkese açık depoda ücretsiz ve sınırsız.

name: Sağlık kontrolü

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # elle de çalıştırılabilsin

jobs:
  saglik:
    # Isimde SAYI YOK: her yeni kontrolde guncellemek gerekirdi ve bir gun
    # unutulup yalan soylerdi. Gercek sayi zaten logun son satirinda.
    name: Saglik kontrolleri
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # v4 -> v5: v4 kendi ici Node 20 istiyor, GitHub onu artik zorla
      # Node 24'te calistirip her calistirmada uyari basiyordu. v5 zaten
      # node24 ile geliyor. (v6 de var; v5 yeterli ve daha oturmus.)
      - name: Depoyu al
        uses: actions/checkout@v5

      # Testleri calistiran Node surumu — yukaridaki adimlarin kendi
      # calisma ortamiyla karistirilmasin, ayri sey.
      # 20 -> 22: Node 20'nin destegi Nisan 2026'da bitti, omru dolmus bir
      # surumde test etmenin anlami yok. 22 su anki LTS ve testler zaten
      # gelistirme ortaminda Node 22 uzerinde geciyor.
      - name: Node kur
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Playwright ve tarayıcı kur
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Sunucu ve test AYNI adımda: ayrı adımlarda başlatılan arka plan
      # süreçlerinin adım sınırından sağ çıkacağı garanti değil. Burada
      # sunucu testle aynı kabukta yaşıyor ve iş bitince kapanıyor.
      #
      # Uygulama file:// üzerinden değil gerçek bir sunucudan açılmalı:
      # service worker ancak http:// altında çalışır.
      - name: Sağlık kontrolü
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          SUNUCU=$!
          trap 'kill $SUNUCU 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/index.html >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/index.html >/dev/null || {
            echo "Yerel sunucu ayaga kalkmadi"; exit 1; }
          node test/saglik.js

  # ─────────────────────────────────────────────────────────────────
  # MOTOR DENKLIGI — WebKit
  #
  # NEDEN AYRI İŞ
  #   WebKit geliştirme ortamına KURULAMIYOR: Playwright'ın indirme
  #   sunucusu oradan kapalı ("Failed to download WebKit ... code=1").
  #   Yani bu testin koşabildiği tek yer burası. Ayrı iş olması ayrıca
  #   Chromium testinin süresini uzatmıyor: ikisi paralel koşuyor.
  #
  # NEDEN 291 KONTROLÜN HEPSİ DEĞİL
  #   O kontrollerin büyük kısmı piksel yerleşimi ve piksel hizası
  #   motorlar arasında zaten farklı. WebKit'te koşturmak gürültü
  #   üretir, bilgi üretmez. test/motor.js yalnızca motor farkına
  #   duyarlı olanı sınıyor: ses grafı, medya API'leri, çizim, CORS,
  #   service worker, klavye, lisans kapısı.
  #
  # NEDEN continue-on-error
  #   WebKit'in ne diyeceğini HENÜZ BİLMİYORUZ. Bilmeden main'e
  #   kırmızı çarpı koymak, ilk gerçek farkta "zaten hep kırmızı"
  #   alışkanlığı yaratır — testlere olan güveni asıl bu öldürür.
  #   İlk turlar RAPOR veriyor. Çıkan farklar düzeltilip koşu
  #   istikrarlı yeşile döndüğünde bu satır KALDIRILACAK.
  #   Bu satır kaldırılmadığı sürece iş yarım demektir.
  motor:
    name: Motor denkligi (WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true      # <- ilk turlar icin; kaldirilacak

    steps:
      - name: Depoyu al
        uses: actions/checkout@v5

      - name: Node kur
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Playwright ve WebKit kur
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps webkit

      - name: Motor denkligi
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          SUNUCU=$!
          trap 'kill $SUNUCU 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/index.html >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8765/index.html >/dev/null || {
            echo "Yerel sunucu ayaga kalkmadi"; exit 1; }
          MOTOR=webkit node test/motor.js
