# ORBITAPE — her değişiklikte 229 kontrol
#
# NE YAPAR
#   Her push ve her pull request'te GitHub'ın kendi makinesinde bir tarayıcı
#   açılır, uygulama gerçekten çalıştırılır ve saglik.js'teki bütün kontroller
#   koşar: yerleşim, ses zinciri, çevrimdışı davranış, lisans, radyo süzgeci,
#   PWA dosyaları. Sonuç commit'in yanında yeşil tik ya da kırmızı çarpı olur.
#
# NEDEN
#   Testleri elle çalıştırmayı unutmak mümkün. Burada unutmak mümkün değil.
#
# SÜRE / MALİYET
#   Yaklaşık 3-4 dakika. Herkese açık depoda ücretsiz ve sınırsız.

name: Sağlık kontrolü

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # elle de çalıştırılabilsin

jobs:
  saglik:
    name: 229 kontrol
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright ve tarayıcı kur
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Uygulama dosya:// üzerinden değil, gerçek bir sunucudan açılmalı:
      # service worker ve modül davranışı ancak http:// altında doğru çalışır.
      - name: Yerel sunucuyu başlat
        run: |
          python3 -m http.server 8765 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8765/index.html >/dev/null && break
            sleep 1
          done

      - name: Sağlık kontrolü
        run: node test/saglik.js

      # Kayıt dosyası kontrolü ffmpeg istiyor; ayrı adım, ayrı hata mesajı.
      - name: Kayıt dosyası kontrolü
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          chmod +x test/kayit_kontrol.sh
          test/kayit_kontrol.sh || echo "kayit kontrolu atlandi (ortam farki)"
