# ORBITAPE — radyo listesi hasadı
#
# NE YAPAR
#   radio-browser dizinine eksik türler için ayrı ayrı sorar, gelenleri
#   uygulamanın KENDİ kurallarıyla süzer, CORS başlığını sınar ve yeni
#   radyo.json'u bu deponun içine yazıp bir PR açar.
#
# NEDEN BURADA KOŞUYOR
#   Geliştirme ortamından radio-browser'a ve istasyon sunucularına
#   çıkış kapalı (ölçüldü: 59 istasyonun 50'sine ulaşılamadı). Ağı
#   olan tek yer burası.
#
# NEDEN OTOMATİK YAYINLAMIYOR
#   Liste kullanıcının duyduğu şey. Her değişiklik gözden geçirilmeli;
#   o yüzden doğrudan main'e yazmıyor, PR açıyor.
#
# SÜRE
#   Her istasyonun CORS başlığı tek tek sınandığı için 10-20 dakika.

name: Radyo hasadı

on:
  workflow_dispatch:          # elle: Actions -> Radyo hasadı -> Run workflow
    inputs:
      hedef:
        description: 'Raf başına hedef istasyon sayısı'
        required: false
        default: '40'
  schedule:
    - cron: '17 4 1 * *'      # ayda bir, her ayın 1'i

permissions:
  contents: write
  pull-requests: write

jobs:
  hasat:
    name: Radyo hasadi
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Depoyu al
        uses: actions/checkout@v5

      # ── IKINCI DEPO KALKTI ────────────────────────────────────
      # Liste eskiden ayri bir VERI deposunda (playjoymusic/tracks)
      # duruyordu ve bu is onu da klonluyordu. Depo ozele alininca
      # is her ayin birinde "Not Found" ile dustu: isin varsayilan
      # jetonu BASKA bir depoyu okuyamaz. Bir sir eklemek cozerdi
      # ama cozmesi gerekmiyordu -- liste zaten IKI yerde duruyordu
      # ve ikisini esitlemek icin iki ayri PR aciliyordu. Bu bir
      # tuzakti: biri birlesip oteki kalirsa uygulama aylarca eski
      # listeyi servis eder ve kimse fark etmez.
      # Artik tek kaynak KOD deposu. Uygulama listeyi zaten oradan
      # (orbitape.app/radyo.json) cekiyor. Sir yok, ikinci PR yok,
      # ayrismaya yer yok.
      - name: Hasat
        run: |
          python3 araclar/radyo_hasat.py \
            radyo.json \
            radyo.yeni.json \
            "${{ github.event.inputs.hedef || '40' }}"
          mv radyo.yeni.json radyo.json

      # Hiçbir şey değişmediyse boş PR açmanın anlamı yok.
      - name: Degisiklik var mi
        id: fark
        run: |
          if git diff --quiet -- radyo.json; then
            echo "var=hayir" >> $GITHUB_OUTPUT
          else
            echo "var=evet" >> $GITHUB_OUTPUT
          fi

      # ── TEK PR ──────────────────────────────────────────────────
      # Eskiden iki PR aciliyordu: biri veri deposuna, biri yayina
      # giden kopya icin buraya. Ikisini birlikte birlestirmek
      # gerekiyordu ve bu, unutulmayi bekleyen bir kuraldi. Tek
      # kaynak kalinca tek PR kaldi.
      - name: PR ac
        if: steps.fark.outputs.var == 'evet'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: radyo-hasat
          title: 'Radyo hasadi: eksik turlere istasyon'
          commit-message: 'Radyo hasadi'
          add-paths: radyo.json
          body: |
            radio-browser'dan eksik turler icin istasyon toplandi.

            Her istasyon uc kapidan gecti:
            1. Uygulamanin kendi elemeleri (ibadet / canli konusma / ulke)
            2. Saflik kurali — istenen rafa GERCEKTEN dusuyor mu
            3. CORS basligi — yoksa uygulamada sessiz kalirdi

            Birlestirmeden once kosunun ciktisindaki raf sayilarina bak.
